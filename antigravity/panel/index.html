<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blender 会话</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px;
        background: var(--color-background-primary, #18181b);
        color: var(--color-text-primary, #f4f4f5);
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
        font-size: 13px;
        line-height: 1.45;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card {
        background: var(--color-background-secondary, #27272a);
        border: 1px solid var(--color-border-primary, #3f3f46);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .title {
        font-weight: 600;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--color-text-tertiary, #71717a);
        display: inline-block;
      }
      .dot.ok {
        background: #22c55e;
      }
      .dot.err {
        background: #ef4444;
      }
      .muted {
        color: var(--color-text-secondary, #a1a1aa);
        font-size: 12px;
      }
      .banner-warn {
        background: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.45);
        color: #fbbf24;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
      }
      .banner-err {
        background: rgba(239, 68, 68, 0.14);
        border: 1px solid rgba(239, 68, 68, 0.45);
        color: #f87171;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12px;
      }
      button {
        font: inherit;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid var(--color-border-primary, #3f3f46);
        background: var(--color-background-tertiary, #3f3f46);
        color: var(--color-text-primary, #f4f4f5);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        filter: brightness(1.1);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.active {
        background: #2563eb;
        border-color: #3b82f6;
        color: #fff;
      }
      button.approve {
        background: #16a34a;
        border-color: #22c55e;
        color: #fff;
      }
      button.deny {
        background: #dc2626;
        border-color: #ef4444;
        color: #fff;
      }
      .btn-group {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .req-card {
        border: 1px solid var(--color-border-primary, #3f3f46);
        border-radius: 6px;
        padding: 8px 10px;
        margin-top: 8px;
        background: var(--color-background-primary, #18181b);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 6px;
      }
      th,
      td {
        text-align: left;
        padding: 5px 6px;
        border-bottom: 1px solid var(--color-border-primary, #3f3f46);
      }
      th {
        color: var(--color-text-secondary, #a1a1aa);
        font-weight: 500;
      }
      .badge {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 4px;
        font-size: 11px;
        background: var(--color-background-tertiary, #3f3f46);
      }
      .preview-img {
        width: 100%;
        max-height: 260px;
        object-fit: contain;
        border-radius: 6px;
        margin-top: 8px;
        background: #09090b;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="root" class="stack">
      <div class="card">正在连接 Blender 会话面板…</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
